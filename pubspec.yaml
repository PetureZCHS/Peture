name: my_pet
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0" # 注意：我将 SDK 版本稍微放宽到了 >=3.0.0 以确保兼容性，原 3.9.0 可能导致报错

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # 添加本地化支持
    sdk: flutter
  adaptive_theme: ^3.7.1+2
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_chat_core: ^2.8.0
  flutter_chat_ui: ^2.9.0
  flutter_markdown: ^0.7.7+1
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.2
  uuid: ^4.5.1
  image_picker: ^1.2.0
  provider: ^6.1.5+1
  settings_ui: ^2.0.2
  share_plus: ^9.0.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1 # 添加Google字体支持

  # --- 新添加的数据库相关依赖 ---
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+4
  path: ^1.9.0
  path_provider: ^2.1.1
  intl: ^0.20.2 # 更新版本以兼容 flutter_localizations

  # --- 美学升级动画依赖 ---
  flutter_staggered_animations: ^1.1.1

  # --- 礼花动画依赖 (新增) ---
  confetti: ^0.7.0

  # --- 瀑布流布局依赖 ---
  flutter_staggered_grid_view: ^0.7.0

  # --- 认证相关依赖 ---
  flutter_secure_storage: ^9.2.2

  # --- 图表依赖 ---
  fl_chart: ^0.69.0

  # --- 音频播放依赖 ---
  audioplayers: ^6.1.0

  # --- HTTP 客户端（用于 LeanCloud REST API） ---
  http: ^1.1.0

  # --- Supabase 依赖（用于 RAG AI 对话） ---
  supabase_flutter: ^2.10.3
  
  # --- Sentry 错误监控 ---
  sentry_flutter: ^8.0.0
  
  # --- 美学升级动画依赖 ---
  liquid_glass_renderer: ^0.2.0-dev.4
  
  # --- 翻页动画依赖 ---
  page_flip: ^0.2.5+1
  
  # --- 图片缓存依赖 ---
  gal: ^2.3.2
  
  # --- 图片缓存依赖 ---
  cached_network_image: ^3.4.0
  
  # --- 传感器依赖（摇晃检测）---
  sensors_plus: ^6.1.1

  # 图片压缩
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4 # <-- 你添加的图标生成器 (正确)

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/icon/
    - assets/mp3/喂食.mp3
    - assets/mp3/握手.mp3
    - assets/mp3/坐下.mp3
    - assets/image_styles/

# --- 启动页配置 ---
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png # <-- 对应 assets/logo.png

  android_12:
    image: assets/logo.png
    icon_background_color: "#FFFFFF"

# --- App 图标配置 (你添加的，正确) ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png" # <-- 对应 assets/icon/app_icon.png
