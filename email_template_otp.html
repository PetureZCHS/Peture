<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>验证您的邮箱 - 智宠合生 Peture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }
        
        .email-container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: #ffffff;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .logo-subtitle {
            font-size: 18px;
            font-weight: 300;
            opacity: 0.95;
        }
        
        .content {
            padding: 50px 40px;
            text-align: center;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        h1 {
            font-size: 28px;
            color: #333333;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .description {
            font-size: 16px;
            color: #666666;
            margin-bottom: 35px;
            line-height: 1.8;
        }
        
        /* 验证码显示区域 */
        .otp-container {
            margin: 40px 0;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 16px;
            border: 2px dashed #667eea;
        }
        
        .otp-label {
            font-size: 14px;
            color: #666666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        
        .otp-code {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            letter-spacing: 12px;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin: 10px 0;
        }
        
        .otp-hint {
            font-size: 14px;
            color: #888888;
            margin-top: 20px;
            line-height: 1.6;
        }
        
        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px 20px;
            margin: 30px 0;
            border-radius: 8px;
            text-align: left;
        }
        
        .warning-box p {
            font-size: 14px;
            color: #856404;
            margin: 5px 0;
        }
        
        .footer {
            background: #f8f9fa;
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid #eeeeee;
        }
        
        .footer-text {
            font-size: 13px;
            color: #999999;
            margin-bottom: 8px;
        }
        
        .footer-brand {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
        }
        
        /* 移动端适配 */
        @media only screen and (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 26px;
            }
            
            .logo-subtitle {
                font-size: 16px;
            }
            
            .content {
                padding: 40px 25px;
            }
            
            .icon {
                width: 70px;
                height: 70px;
                font-size: 35px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .description {
                font-size: 15px;
            }
            
            .otp-code {
                font-size: 36px;
                letter-spacing: 8px;
            }
            
            .footer {
                padding: 25px 20px;
            }
        }
        
        @media only screen and (max-width: 400px) {
            .logo {
                font-size: 22px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .content {
                padding: 30px 20px;
            }
            
            .otp-code {
                font-size: 32px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- 头部品牌区域 -->
        <div class="header">
            <div class="logo">智宠合生</div>
            <div class="logo-subtitle">Peture</div>
        </div>
        
        <!-- 主要内容区域 -->
        <div class="content">
            <!-- 图标 -->
            <div class="icon">🐾</div>
            
            <!-- 标题 -->
            <h1>验证您的邮箱地址</h1>
            
            <!-- 描述文字 -->
            <p class="description">
                感谢您使用智宠合生 Peture ！<br>
                请在应用中输入以下验证码完成注册。
            </p>
            
            <!-- 验证码显示区域 -->
            <div class="otp-container">
                <div class="otp-label">您的验证码</div>
                <div class="otp-code">{{ .Token }}</div>
                <div class="otp-hint">
                    请在 1 小时内使用此验证码<br>
                    验证码仅可使用一次
                </div>
            </div>
            
            <!-- 提示信息 -->
            <div class="warning-box">
                <p><strong>⚠️ 安全提示：</strong></p>
                <p>• 请勿将验证码告知他人</p>
                <p>• 验证码有效期为 1 小时</p>
                <p>• 如果您没有注册智宠合生账号，请忽略此邮件</p>
            </div>
        </div>
        
        <!-- 页脚信息 -->
        <div class="footer">
            <p class="footer-text">此验证码将很快失效，请及时使用。</p>
            <div class="footer-brand">智宠合生 Peture | 宠物一站式服务平台</div>
        </div>
    </div>
</body>
</html>
